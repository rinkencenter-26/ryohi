        const gsiStdLayer = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
        });
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        });
        const gsiPhotoLayer = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
            maxZoom: 18,
            attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
        });

        const map = L.map('map', {
            center: [32.6500, 130.7000],
            zoom: 9,
            layers: [gsiStdLayer]
        });

        const baseMaps = { "gsiStd": gsiStdLayer, "osm": osmLayer, "gsiPhoto": gsiPhotoLayer };
        const mapTypeControl = L.control({ position: 'topright' });
        mapTypeControl.onAdd = function() {
            const div = L.DomUtil.create('div', 'map-type-control');
            div.innerHTML = `
                <label style="font-weight:bold; margin-right:5px;">背景地図:</label>
                <select id="map-type-select">
                    <option value="gsiStd">国土地理院 (標準地図)</option>
                    <option value="osm">OpenStreetMap</option>
                    <option value="gsiPhoto">国土地理院 (航空写真)</option>
                </select>
            `;
            L.DomEvent.disableClickPropagation(div);
            return div;
        };
        mapTypeControl.addTo(map);

        let currentBaseLayer = gsiStdLayer;
        document.getElementById('map-type-select').addEventListener('change', function(e) {
            if (currentBaseLayer) map.removeLayer(currentBaseLayer);
            currentBaseLayer = baseMaps[e.target.value];
            map.addLayer(currentBaseLayer);
        });

        const selectEl = document.getElementById('location-select');
        travelDestinations.forEach((dest, index) => {
            if (dest.isOffice) {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = dest.name;
                selectEl.appendChild(opt);
            }
        });

        const activeMarkerGroup = L.layerGroup().addTo(map);
        let activeCircle = null;
        let clickMarker = null;
        let lineToOffice = null;
        let lineToNearest = null;
        let selectedOfficeData = null;
        let lastHighlightedMarker = null;

        selectEl.addEventListener('change', function(e) {
            clearAllLayers();

            const idx = e.target.value;
            if (idx === "") {
                selectedOfficeData = null;
                document.getElementById('result-info').innerHTML = "上のリストから拠点を選択してください。";
                return;
            }

            const selected = travelDestinations[idx];
            selectedOfficeData = selected;

            map.setView([selected.lat, selected.lng], 12);
            drawCircle(selected);

            const officeMarker = L.circleMarker([selected.lat, selected.lng], {
                radius: 11,
                color: '#1a365d',
                fillColor: '#1a365d',
                fillOpacity: 0.95,
                weight: 3
            }).addTo(activeMarkerGroup);

            const popupContent = selected.address 
                ? `<b>${selected.name}</b><br><small>${selected.address}</small>`
                : `<b>${selected.name}</b>`;
            officeMarker.bindPopup(popupContent);

            const officeLatLng = L.latLng(selected.lat, selected.lng);

            travelDestinations.forEach(dest => {
                if (dest === selected) return;

                const dist = map.distance(officeLatLng, L.latLng(dest.lat, dest.lng));
                const isInside = dist <= RADIUS_METERS;

                const marker = L.circleMarker([dest.lat, dest.lng], {
                    radius: isInside ? 7 : 6,
                    color: isInside ? '#c62828' : '#0275d8',
                    fillColor: isInside ? '#e53935' : '#29b6f6',
                    fillOpacity: 0.85,
                    weight: 2
                }).addTo(activeMarkerGroup);

                marker.destData = dest;
                marker.isInside = isInside;

                const isOfficeName = dest.isOffice || dest.name === "県庁" || dest.name.includes("振興局");

                if (!isOfficeName) {
                    const labelClass = isInside 
                        ? 'marker-label marker-label-inside' 
                        : 'marker-label marker-label-outside';

                    marker.bindTooltip(dest.name, {
                        permanent: true,
                        direction: 'right',
                        offset: [8, 0],
                        className: labelClass
                    });
                }

                const zoneLabel = isInside 
                    ? '<b class="zone-inside">【在勤地内】</b>' 
                    : '<b class="zone-outside">【在勤地外】</b>';

                marker.bindPopup(`
                    <b>${dest.name}</b><br>
                    ${zoneLabel}<br>
                    拠点からの距離: ${(dist / 1000).toFixed(2)} km
                `);
            });

            const addressText = selected.address ? `<p style="margin:2px 0 0 0; font-size:12px; color:#000000;">${selected.address}</p>` : '';
            const panel = document.getElementById('result-info');
            panel.innerHTML = `
                <p style="margin:0;">基準拠点: ${selected.name}</p>
                ${addressText}
            `;
        });

        map.on('click', function(e) {
            if (!selectedOfficeData) {
                alert("先にドロップダウンリストから対象の拠点を選択してください。");
                return;
            }

            clearClickData();

            clickMarker = L.circleMarker(e.latlng, {
                color: '#0275d8',
                radius: 8,
                fillColor: '#0275d8',
                fillOpacity: 0.9,
                weight: 2
            }).addTo(map);

            const officeLatLng = L.latLng(selectedOfficeData.lat, selectedOfficeData.lng);
            const minDistance = map.distance(e.latlng, officeLatLng);

            lineToOffice = L.polyline([e.latlng, officeLatLng], {
                color: '#0275d8',
                weight: 2,
                dashArray: '5, 5'
            }).addTo(map);

            const isInside8km = minDistance <= RADIUS_METERS;
            const zoneText = isInside8km 
                ? `<span class="zone-inside">在勤地内 (8km圏内)</span>` 
                : `<span class="zone-outside">在勤地外 (8km超)</span>`;

            let nearestMarker = null;
            let minDestDist = Infinity;

            activeMarkerGroup.eachLayer(layer => {
                if (layer.destData && !layer.destData.isOffice) {
                    const d = map.distance(e.latlng, layer.getLatLng());
                    if (d < minDestDist) {
                        minDestDist = d;
                        nearestMarker = layer;
                    }
                }
            });

            if (nearestMarker) {
                nearestMarker.setStyle({
                    radius: 12,
                    color: '#d32f2f',
                    fillColor: '#ffeb3b',
                    fillOpacity: 1.0,
                    weight: 3
                });
                nearestMarker.bringToFront();
                lastHighlightedMarker = nearestMarker;

                lineToNearest = L.polyline([e.latlng, nearestMarker.getLatLng()], {
                    color: '#f57c00',
                    weight: 3,
                    dashArray: '4, 4'
                }).addTo(map);
            }

            const nearestText = nearestMarker 
                ? `【${nearestMarker.destData.name}】` 
                : "データなし";
            const nearestDistText = nearestMarker
                ? `約 ${(minDestDist / 1000).toFixed(2)} km`
                : "-";

            const panel = document.getElementById('result-info');
            panel.innerHTML = `
                <p style="margin:3px 0; color:#000000;">基準拠点: ${selectedOfficeData.name}</p>
                <p style="margin:3px 0;" class="dest-highlight">最寄り地点: ${nearestText}</p>
                <p style="margin:3px 0; font-size:13px; color:#000000;">地点までの距離: ${nearestDistText}</p>
                <hr style="margin:3px 0; border:0; border-top:1px solid #ddd;">
                <p style="margin:3px 0; color:#000000;">拠点からの距離: <span class="distance-highlight">${(minDistance / 1000).toFixed(2)} km</span></p>
                <p style="margin:3px 0; color:#000000;">判定区分: ${zoneText}</p>
            `;
        });

        function drawCircle(office) {
            activeCircle = L.circle([office.lat, office.lng], {
                color: '#d9534f',
                fillColor: '#f03',
                fillOpacity: 0.12,
                radius: RADIUS_METERS,
                interactive: false
            }).addTo(map);
        }

        function clearClickData() {
            if (clickMarker) { map.removeLayer(clickMarker); clickMarker = null; }
            if (lineToOffice) { map.removeLayer(lineToOffice); lineToOffice = null; }
            if (lineToNearest) { map.removeLayer(lineToNearest); lineToNearest = null; }
            
            if (lastHighlightedMarker) {
                const isInside = lastHighlightedMarker.isInside;
                lastHighlightedMarker.setStyle({
                    radius: isInside ? 7 : 6,
                    color: isInside ? '#c62828' : '#0275d8',
                    fillColor: isInside ? '#e53935' : '#29b6f6',
                    fillOpacity: 0.85,
                    weight: 2
                });
                lastHighlightedMarker = null;
            }
        }

        function clearAllLayers() {
            activeMarkerGroup.clearLayers();
            if (activeCircle) { map.removeLayer(activeCircle); activeCircle = null; }
            clearClickData();
        }
    </script>
</body>
</html>
